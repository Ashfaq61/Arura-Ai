name: AURA AI Android CI & APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect project directory
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts within 3 levels."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected PROJECT_DIR=$PROJECT_DIR"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass "${KEYSTORE_PASSWORD:-android}" \
              -alias "${KEY_ALIAS:-androiddebugkey}" \
              -keypass "${KEY_PASSWORD:-android}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f ~/.android/debug.keystore debug.keystore

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Grant Gradle execute permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            ./gradlew assembleRelease --stacktrace
          else
            echo "Skipping Release APK build: signing secrets not configured."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports
            ${{ env.PROJECT_DIR }}/**/build/test-results

      - name: Publish Signed Self-Update APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          APK_SOURCE=$(find . -path "*/build/outputs/apk/debug/*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: No debug APK found to publish."
            exit 1
          fi

          PUBLISH_APK="aura-ai-${RELEASE_TAG}.apk"
          cp -f "$APK_SOURCE" "$PUBLISH_APK"

          if [ -n "$KEYSTORE_BASE64" ] && [ -f ~/.android/debug.keystore ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks ~/.android/debug.keystore \
                --ks-pass "pass:${KEYSTORE_PASSWORD:-android}" \
                --ks-key-alias "${KEY_ALIAS:-androiddebugkey}" \
                --key-pass "pass:${KEY_PASSWORD:-android}" \
                "$PUBLISH_APK"
            fi
          fi

          gh release create "$RELEASE_TAG" "$PUBLISH_APK" \
            --title "Aura AI $RELEASE_TAG" \
            --notes "Automated Aura AI build #$GITHUB_RUN_NUMBER (versionCode=${{ github.run_number }}, commit=${{ github.sha }})." \
            --latest || \
          gh release upload "$RELEASE_TAG" "$PUBLISH_APK" --clobber
