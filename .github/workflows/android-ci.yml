name: AURA AI Android CI & APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect project directory
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts within 3 levels."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected PROJECT_DIR=$PROJECT_DIR"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare debug keystore (never overwrite with upload release keystore)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compute monotonic versionCode
        run: |
          RAW_RUN="${GITHUB_RUN_NUMBER:-16}"
          if [ "$RAW_RUN" -lt 16 ]; then
            EFFECTIVE_RUN=16
          else
            EFFECTIVE_RUN="$RAW_RUN"
          fi
          echo "EFFECTIVE_RUN_NUMBER=$EFFECTIVE_RUN" >> "$GITHUB_ENV"
          echo "Effective versionCode=$EFFECTIVE_RUN (versionName=1.0.$EFFECTIVE_RUN)"

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Grant Gradle execute permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests (Mandatory Gate)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew lintDebug --stacktrace

      - name: Verify Release Signing Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EFFECTIVE_STORE_PASS="${SECRET_STORE_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
          MISSING_LIST=()

          [ -z "$KEYSTORE_BASE64" ] && MISSING_LIST+=("KEYSTORE_BASE64")
          if [ -z "$EFFECTIVE_STORE_PASS" ]; then
            if [ -z "$SECRET_STORE_PASSWORD" ] && [ -z "$SECRET_KEYSTORE_PASSWORD" ]; then
              MISSING_LIST+=("STORE_PASSWORD (or KEYSTORE_PASSWORD)")
            fi
          fi
          [ -z "$SECRET_KEY_PASSWORD" ] && MISSING_LIST+=("KEY_PASSWORD")
          [ -z "$SECRET_KEY_ALIAS" ] && MISSING_LIST+=("KEY_ALIAS")

          # Check if only KEY_PASSWORD was omitted for a PKCS12 keystore where key password == store password
          CAN_TRY_SINGLE_PASS=false
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$EFFECTIVE_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -z "$SECRET_KEY_PASSWORD" ]; then
            CAN_TRY_SINGLE_PASS=true
          fi

          if [ "${#MISSING_LIST[@]}" -gt 0 ] && [ "$CAN_TRY_SINGLE_PASS" != "true" ]; then
            echo "BLOCKER: Missing required GitHub Actions release signing secrets:"
            for item in "${MISSING_LIST[@]}"; do
              echo "  - $item"
            done
            echo ""
            echo "Configure these under GitHub Repository -> Settings -> Secrets and variables -> Actions:"
            echo "  1. KEYSTORE_BASE64           (Base64 of your existing production .jks keystore)"
            echo "  2. STORE_PASSWORD            (Keystore password; KEYSTORE_PASSWORD is also accepted)"
            echo "  3. KEY_PASSWORD              (Private key password for alias 'upload')"
            echo "  4. KEY_ALIAS                 (Set to 'upload' to match app/build.gradle.kts)"
            echo "  Optional: EXPECTED_SIGNING_CERT_SHA256 (64-hex SHA-256 fingerprint of your release cert)"
            echo "Note: Never generate a replacement keystore if an existing production APK is already published."

            {
              echo "### Release Signing Configuration Blocked"
              echo "Missing GitHub repository secrets:"
              for item in "${MISSING_LIST[@]}"; do
                echo "- \`$item\`"
              done
              echo ""
              echo "Add them in **Settings -> Secrets and variables -> Actions**. Never commit keystores or replace an existing production signing identity."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "PR event without release signing secrets; skipping signed release build while enforcing mandatory tests & lint."
              echo "CAN_BUILD_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
              exit 0
            else
              echo "ERROR: Cannot build signed release APK while required secrets are missing."
              exit 1
            fi
          fi

          # Validate keystore integrity, alias match, non-debug certificate, and key unlock in temp dir
          TMP_KS="$(mktemp /tmp/aura-verify-ks-XXXXXX.jks)"
          TMP_JAR="$(mktemp /tmp/aura-verify-jar-XXXXXX.jar)"
          TMP_SRC="$(mktemp /tmp/aura-verify-entry-XXXXXX.txt)"
          cleanup_tmp() {
            rm -f "$TMP_KS" "$TMP_JAR" "$TMP_SRC"
          }
          trap cleanup_tmp EXIT

          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$TMP_KS" 2>/dev/null || [ ! -s "$TMP_KS" ]; then
            echo "ERROR: KEYSTORE_BASE64 could not be decoded into a valid non-empty keystore file."
            exit 1
          fi

          if [ "$SECRET_KEY_ALIAS" != "upload" ]; then
            echo "ERROR: KEY_ALIAS secret does not match app/build.gradle.kts (expected 'upload')."
            echo "Update KEY_ALIAS or ensure the production keystore contains alias 'upload'."
            exit 1
          fi

          if ! KEY_INFO=$(keytool -list -v -keystore "$TMP_KS" -storepass "$EFFECTIVE_STORE_PASS" -alias "upload" 2>/dev/null); then
            echo "ERROR: Failed to open keystore with STORE_PASSWORD/KEYSTORE_PASSWORD or locate alias 'upload'."
            exit 1
          fi

          if echo "$KEY_INFO" | grep -qi "CN=Android Debug"; then
            echo "ERROR: Provided keystore contains an Android Debug certificate! Refusing to sign a release build with a debug key."
            exit 1
          fi

          EFFECTIVE_KEY_PASS="${SECRET_KEY_PASSWORD:-$EFFECTIVE_STORE_PASS}"
          printf 'aura-signing-probe' > "$TMP_SRC"
          jar cf "$TMP_JAR" -C /tmp "$(basename "$TMP_SRC")"
          if ! jarsigner -keystore "$TMP_KS" -storepass "$EFFECTIVE_STORE_PASS" -keypass "$EFFECTIVE_KEY_PASS" "$TMP_JAR" "upload" >/dev/null 2>&1; then
            if [ -z "$SECRET_KEY_PASSWORD" ]; then
              echo "ERROR: KEY_PASSWORD secret is missing and STORE_PASSWORD could not unlock key alias 'upload'."
            else
              echo "ERROR: KEY_PASSWORD could not unlock private key alias 'upload' in the decoded keystore."
            fi
            exit 1
          fi

          echo "Release signing configuration verified (decoded keystore, store/key passwords, and non-debug alias 'upload')."
          echo "CAN_BUILD_SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        if: env.CAN_BUILD_SIGNED_RELEASE == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_RUN_NUMBER: ${{ env.EFFECTIVE_RUN_NUMBER }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cleanup_ks() {
            rm -f my-upload-key.jks
          }
          trap cleanup_ks EXIT

          EFFECTIVE_STORE_PASS="${SECRET_STORE_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
          EFFECTIVE_KEY_PASS="${SECRET_KEY_PASSWORD:-$EFFECTIVE_STORE_PASS}"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          export STORE_PASSWORD="$EFFECTIVE_STORE_PASS"
          export KEY_PASSWORD="$EFFECTIVE_KEY_PASS"

          ./gradlew assembleRelease --stacktrace

          RELEASE_APK=$(find . -path "*/build/outputs/apk/release/*.apk" ! -path "*/debug/*" ! -name "*unsigned*" ! -name "*-debug*" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: assembleRelease succeeded but no signed release APK was produced."
            exit 1
          fi
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Verify Signed Release APK Integrity
        if: env.CAN_BUILD_SIGNED_RELEASE == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT2" ]; then
            echo "ERROR: Android build-tools (apksigner / aapt2) not found."
            exit 1
          fi

          echo "Verifying APK signature and integrity..."
          SIGN_INFO=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK")
          echo "$SIGN_INFO"
          if echo "$SIGN_INFO" | grep -qi "CN=Android Debug"; then
            echo "ERROR: APK is signed with a debug certificate! Refusing to publish debug-signed APK as release."
            exit 1
          fi
          if echo "$SIGN_INFO" | tr '[:upper:]' '[:lower:]' | grep -q "f423815e2efde18a7de913ab4d9d4de679723103884dec8b3d4f86176c1184f1"; then
            echo "ERROR: APK matches repository debug keystore fingerprint! Refusing to publish."
            exit 1
          fi
          if [ -n "${EXPECTED_SIGNING_CERT_SHA256:-}" ]; then
            NORMALIZED_EXPECTED=$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if ! echo "$SIGN_INFO" | tr '[:upper:]' '[:lower:]' | grep -q "$NORMALIZED_EXPECTED"; then
              echo "ERROR: APK signing certificate SHA-256 does not match EXPECTED_SIGNING_CERT_SHA256."
              exit 1
            fi
          fi

          BADGING=$("$AAPT2" dump badging "$RELEASE_APK")
          echo "$BADGING" | head -n 5
          PKG_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VER_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          VER_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)

          if [ "$PKG_NAME" != "com.aistudio.auraai.xkmqzp" ]; then
            echo "ERROR: Package name mismatch. Expected com.aistudio.auraai.xkmqzp, got $PKG_NAME"
            exit 1
          fi
          if [ "$VER_CODE" != "$EFFECTIVE_RUN_NUMBER" ]; then
            echo "ERROR: versionCode mismatch. Expected $EFFECTIVE_RUN_NUMBER, got $VER_CODE"
            exit 1
          fi

          RELEASE_TAG="v1.0.${EFFECTIVE_RUN_NUMBER}"
          PUBLISH_APK="aura-ai-${RELEASE_TAG}-release.apk"
          cp -f "$RELEASE_APK" "$PUBLISH_APK"
          sha256sum "$PUBLISH_APK" > "${PUBLISH_APK}.sha256"
          sha256sum -c "${PUBLISH_APK}.sha256"
          cat "${PUBLISH_APK}.sha256"

          {
            echo "### Verified Signed Release APK"
            echo "- File: \`$PUBLISH_APK\`"
            echo "- Package ID: \`$PKG_NAME\`"
            echo "- Version: \`$VER_NAME\` (\`versionCode=$VER_CODE\`)"
            echo "- File SHA-256: \`$(awk '{print $1}' "${PUBLISH_APK}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PUBLISH_APK=$PUBLISH_APK" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "APK_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Upload Signed Release APK Artifact
        if: env.CAN_BUILD_SIGNED_RELEASE == 'true' && env.APK_VERIFIED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.PUBLISH_APK }}
            ${{ env.PROJECT_DIR }}/${{ env.PUBLISH_APK }}.sha256
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports
            ${{ env.PROJECT_DIR }}/**/build/test-results

      - name: Publish Signed Self-Update Release APK
        if: env.CAN_BUILD_SIGNED_RELEASE == 'true' && env.APK_VERIFIED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "$PUBLISH_APK" ] || [ ! -f "${PUBLISH_APK}.sha256" ]; then
            echo "ERROR: Verified signed release APK or SHA-256 checksum missing. Refusing to publish."
            exit 1
          fi
          SHA256_HEX=$(awk '{print $1}' "${PUBLISH_APK}.sha256")
          RELEASE_NOTES="Verified signed release APK for Aura AI ${RELEASE_TAG} (package=com.aistudio.auraai.xkmqzp, versionCode=${EFFECTIVE_RUN_NUMBER}, commit=${{ github.sha }}). SHA-256: ${SHA256_HEX}"

          gh release create "$RELEASE_TAG" "$PUBLISH_APK" "${PUBLISH_APK}.sha256" \
            --title "Aura AI $RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --latest || \
          gh release upload "$RELEASE_TAG" "$PUBLISH_APK" "${PUBLISH_APK}.sha256" --clobber

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${PUBLISH_APK}"
          echo "Published Signed Release APK: $DOWNLOAD_URL"
          {
            echo "### GitHub Release Published"
            echo "- Release Tag: \`$RELEASE_TAG\`"
            echo "- Signed APK Download: $DOWNLOAD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
